module_name: Nooploop LinkTrack UWB positioning
serial_config:
  - command: linktrack start -d ${SERIAL_DEV} -b p:${BAUD_PARAM}
    port_config_param:
      name: LT_PORT_CFG
      group: UWB

parameters:
  - group: UWB
    definitions:
      LT_TF_ROT:
        description:
          short: LinkTrack anchor frame to local frame mapping
          long: |
            Coordinate mapping from the Nooploop anchor coordinate system to
            the PX4 local frame. The LinkTrack anchor system is right-handed
            with Z up (ENU-like). Default converts ENU to NED (x<->y, z flipped).
            Use "NED passthrough" only if the anchor frame was surveyed as NED.
        type: enum
        values:
          0: ENU to NED (default, anchor frame is ENU/Z-up)
          1: NED passthrough
        default: 0

      LT_TF_YAW:
        description:
          short: Yaw offset between anchor frame and EKF local frame
          long: |
            The EKF local frame X axis is aligned with magnetic north (from the
            compass), while the LinkTrack anchor frame X axis points from A0 to
            A3. This parameter rotates the UWB position/velocity so both frames
            agree. Calibration: point the vehicle nose along the anchor X axis,
            read the heading shown by QGC, enter that value here (degrees,
            clockwise positive). Leave at 0 if the anchor X axis already points
            magnetic north.
        type: float
        unit: deg
        decimal: 1
        increment: 1
        min: -180
        max: 180
        default: 0

      LT_COV_POS:
        description:
          short: Fallback position variance
          long: Position variance used when the tag does not report a valid
                error-of-position estimate (eop). Unit is variance, i.e.
                (standard deviation)^2.
        type: float
        unit: m^2
        decimal: 4
        increment: 0.0025
        default: 0.01

      LT_COV_VEL:
        description:
          short: Velocity variance
          long: Velocity variance reported with the visual odometry velocity.
        type: float
        unit: (m/s)^2
        decimal: 4
        increment: 0.0025
        default: 0.04

      LT_MAX_STEP:
        description:
          short: Maximum frame-to-frame position step (glitch rejection)
          long: |
            Glitch rejection for EMI-corrupted frames. A frame whose horizontal
            displacement from the last accepted frame exceeds this threshold is
            dropped (not published). At 100 Hz update rate, 0.1 m corresponds
            to 10 m/s of physical motion, far above anything a hovering/flying
            multirotor can do, so any larger step is by definition a glitch.
            If 10 consecutive received frames are mutually consistent below the
            threshold (e.g. after a genuine anchor recalibration moved the
            solution), the filter resyncs and accepts the new position. Set to
            0 to disable the filter.
        type: float
        unit: m
        decimal: 2
        min: 0
        max: 5
        default: 0.1

      LT_LPF_TAU:
        description:
          short: Low-pass filter time constant for UWB position/velocity
          long: |
            First-order low-pass filter applied to the horizontal UWB position
            and velocity after glitch rejection. Higher values smooth more but
            add more lag. At 100 Hz input a tau of 0.05 s adds roughly 50 ms of
            group delay, which is safe for hovering and slow flight. Set to 0
            to disable the filter (raw LinkTrack output is published).
        type: float
        unit: s
        decimal: 3
        increment: 0.005
        min: 0
        max: 0.5
        default: 0.05

      LT_COV_VEL_Z:
        description:
          short: Vertical velocity variance
          long: |
            Variance reported for the vertical (z) component of the visual
            odometry velocity. The tag's z channel is unreliable with
            MATH_MODEL2 (cannot distinguish above/below the anchor plane), so
            the default is deliberately huge to make the EKF ignore UWB
            vertical velocity while keeping horizontal velocity fusion.
        type: float
        unit: (m/s)^2
        decimal: 1
        increment: 1
        default: 25
