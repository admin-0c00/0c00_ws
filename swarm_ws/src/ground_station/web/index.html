<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>SwarmCore 地面站</title>
<script src="lib/roslib.min.js"></script>
<script src="lib/three.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #0d1117; color: #e6edf3; font-family: "PingFang SC", "Microsoft YaHei", sans-serif; overflow: hidden; }
  #header { display: flex; align-items: center; gap: 12px; padding: 8px 16px; background: #161b22; border-bottom: 1px solid #30363d; }
  #header h1 { font-size: 16px; font-weight: 600; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: #f85149; }
  .dot.ok { background: #3fb950; }
  #conn-text { font-size: 13px; color: #8b949e; }
  #main { display: flex; height: calc(100vh - 41px); }
  #sidebar { width: 340px; min-width: 340px; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 10px; background: #0d1117; }
  #view3d { flex: 1; position: relative; }
  #view3d canvas { display: block; }
  #hint { position: absolute; bottom: 10px; left: 12px; font-size: 12px; color: #8b949e; user-select: none; }
  .card { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 10px 12px; }
  .card.stale { opacity: 0.45; }
  .card-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .card-title { font-size: 15px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
  .color-chip { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
  .badge { font-size: 12px; padding: 2px 8px; border-radius: 10px; background: #30363d; color: #8b949e; }
  .badge.armed { background: #9e3a3a; color: #ffb3b3; }
  .badge.offboard { background: #1f6feb; color: #cfe5ff; }
  .kv { display: grid; grid-template-columns: 84px 1fr; row-gap: 3px; font-size: 13px; }
  .kv .k { color: #8b949e; }
  .kv .v { font-family: "JetBrains Mono", Consolas, monospace; }
  .bat-bar { height: 8px; border-radius: 4px; background: #30363d; overflow: hidden; margin-top: 4px; }
  .bat-fill { height: 100%; border-radius: 4px; transition: width 0.4s; }
  #empty { color: #8b949e; font-size: 13px; text-align: center; margin-top: 30px; }
  #global-ctl { margin-left: auto; display: flex; gap: 8px; }
  .gbtn, .cbtn { background: #0d2740; color: #58d6ff; border: 1px solid #1c4a6e; border-radius: 6px; padding: 4px 12px; font-size: 12px; cursor: pointer; transition: background 0.15s; }
  .gbtn:hover, .cbtn:hover { background: #144a75; }
  .gbtn.danger, .cbtn.danger { background: #3a1a1a; color: #ff8a80; border-color: #6e2b2b; }
  .gbtn.danger:hover, .cbtn.danger:hover { background: #5c2424; }
  .ctl-row { display: flex; gap: 6px; margin-top: 8px; }
  .ctl-row .cbtn { flex: 1; padding: 4px 0; }
</style>
</head>
<body>
<div id="header">
  <h1>SwarmCore 地面站</h1>
  <div class="dot" id="conn-dot"></div>
  <span id="conn-text">连接 rosbridge...</span>
  <div id="global-ctl">
    <button class="gbtn" data-cmd="takeoff">全部起飞</button>
    <button class="gbtn" data-cmd="rtl">全部返航</button>
    <button class="gbtn" data-cmd="land">全部降落</button>
    <button class="gbtn danger" data-cmd="disarm">全部上锁</button>
  </div>
</div>
<div id="main">
  <div id="sidebar"><div id="empty">等待无人机数据…<br>请先启动仿真 (start_swarm_sim.sh)</div></div>
  <div id="view3d"><div id="hint">左键拖拽旋转 · 滚轮缩放 · 右键拖拽平移 | 网格 1m · 北 = -Z 方向 · 青色圆柱 = 地理围栏 R10m × H6m</div></div>
</div>

<script>
// ============================== 配置 ==============================
const ROSBRIDGE_URL = `ws://${location.hostname}:9090`;
const MAX_UAV = 6;
const COLORS = [0xff5252, 0x4caf50, 0x42a5f5, 0xff9800, 0xab47bc, 0x26c6da];
const CSS_COLORS = ['#ff5252', '#4caf50', '#42a5f5', '#ff9800', '#ab47bc', '#26c6da'];
const NAV_STATES = {
  0: 'MANUAL', 1: 'ALTITUDE', 2: 'POSITION', 3: 'AUTO_MISSION', 4: 'HOLD',
  5: 'AUTO_RTL', 6: 'POSITION_SLOW', 10: 'ACRO', 14: 'OFFBOARD',
  15: 'STABILIZED', 17: 'AUTO_TAKEOFF', 18: 'AUTO_LAND', 19: 'AUTO_FOLLOW_TARGET',
};
const TRAIL_LEN = 600;
const FENCE_R = 10;   // 地理围栏半径 (m)，以共享原点为圆心
const FENCE_H = 6;    // 围栏可视化高度 (m)

// ============================== 状态 ==============================
const uavs = {}; // ns -> {status, battery, pos, lastSeen, card, mesh, label, trail...}
const ros = new ROSLIB.Ros({ url: ROSBRIDGE_URL });

ros.on('connection', () => setConn(true));
ros.on('close', () => { setConn(false); setTimeout(() => ros.connect(ROSBRIDGE_URL), 2000); });
ros.on('error', () => setConn(false));

function setConn(ok) {
  document.getElementById('conn-dot').className = ok ? 'dot ok' : 'dot';
  document.getElementById('conn-text').textContent = ok ? 'rosbridge 已连接' : 'rosbridge 断开, 重连中…';
}

// ============================== 订阅 ==============================
for (let i = 1; i <= MAX_UAV; i++) {
  const ns = `uav_${i}`;
  sub(ns, 'vehicle_status', 'px4_msgs/msg/VehicleStatus', (m) => {
    const u = getUav(ns, i);
    u.status = m; u.lastSeen = Date.now(); updateCard(u);
  });
  sub(ns, 'battery_status', 'px4_msgs/msg/BatteryStatus', (m) => {
    const u = getUav(ns, i);
    u.battery = m; u.lastSeen = Date.now(); updateCard(u);
  });
  sub(ns, 'vehicle_local_position', 'px4_msgs/msg/VehicleLocalPosition', (m) => {
    const u = getUav(ns, i);
    u.pos = m; u.lastSeen = Date.now(); updateCard(u); update3D(u);
  });
  sub(ns, 'vehicle_attitude', 'px4_msgs/msg/VehicleAttitude', (m) => {
    const u = getUav(ns, i);
    u.att = m; u.lastSeen = Date.now();
    if (u.pos) update3D(u);
  });
  sub(ns, 'vehicle_global_position', 'px4_msgs/msg/VehicleGlobalPosition', (m) => {
    const u = getUav(ns, i);
    if (!geoRef && m.lat && m.lon) geoRef = { lat: m.lat, lon: m.lon, alt: m.alt };
    u.gpos = m; u.lastSeen = Date.now();
    if (u.pos) { updateCard(u); update3D(u); }
  });
}

function sub(ns, topic, type, cb) {
  new ROSLIB.Topic({ ros, name: `/${ns}/fmu/out/${topic}`, messageType: type }).subscribe(cb);
}

function getUav(ns, idx) {
  if (!uavs[ns]) {
    uavs[ns] = { ns, idx, color: COLORS[(idx - 1) % COLORS.length], css: CSS_COLORS[(idx - 1) % CSS_COLORS.length], trailPts: [] };
    createCard(uavs[ns]); createMesh(uavs[ns]);
    document.getElementById('empty')?.remove();
  }
  return uavs[ns];
}

// ============================== 状态卡片 ==============================
const sidebar = document.getElementById('sidebar');

function createCard(u) {
  const el = document.createElement('div');
  el.className = 'card';
  el.dataset.ns = u.ns;
  el.innerHTML = `
    <div class="card-head">
      <div class="card-title"><span class="color-chip" style="background:${u.css}"></span>${u.ns}</div>
      <span class="badge" data-f="badge">待机</span>
    </div>
    <div class="kv">
      <span class="k">飞行模式</span><span class="v" data-f="mode">-</span>
      <span class="k">电量</span><span class="v" data-f="bat">-</span>
      <span class="k">电压/电流</span><span class="v" data-f="volt">-</span>
      <span class="k">位置 N/E/Alt</span><span class="v" data-f="pos">-</span>
      <span class="k">速度 水平/垂直</span><span class="v" data-f="vel">-</span>
    </div>
    <div class="bat-bar"><div class="bat-fill" data-f="batfill" style="width:0%;background:#3fb950"></div></div>
    <div class="ctl-row">
      <button class="cbtn" data-a="arm">解锁</button>
      <button class="cbtn" data-a="takeoff">起飞</button>
      <button class="cbtn" data-a="rtl">返航</button>
      <button class="cbtn" data-a="land">降落</button>
      <button class="cbtn danger" data-a="disarm">上锁</button>
    </div>`;
  sidebar.appendChild(el);
  u.card = el;
}

// ============================== 控制指令 ==============================
// MAVLink 命令: 400=ARM_DISARM, 22=NAV_TAKEOFF, 20=NAV_RTL, 21=NAV_LAND
// 链路已验证: rosbridge 默认 QoS (reliable) 可匹配 PX4 fmu/in 的 reliable 订阅
const MAV_CMDS = {
  arm:     { command: 400, param1: 1 },
  disarm:  { command: 400, param1: 0 },
  takeoff: { command: 22 },
  rtl:     { command: 20 },
  land:    { command: 21 },
};
const cmdTopics = {};

function sendCmd(u, action) {
  const def = MAV_CMDS[action];
  if (!def) return;
  // PX4 的起飞命令只负责切到 AUTO_TAKEOFF 模式，未解锁时不会执行；
  // 因此起飞 = 先解锁，1 秒后再发起飞（已解锁时 arm 是无害的重复命令）
  if (action === 'takeoff') {
    publishCmd(u, MAV_CMDS.arm);
    setTimeout(() => publishCmd(u, def), 1000);
    return;
  }
  publishCmd(u, def);
}

function publishCmd(u, def) {
  const name = `/${u.ns}/fmu/in/vehicle_command`;
  const topic = cmdTopics[name] || (cmdTopics[name] = (() => {
    const t = new ROSLIB.Topic({ ros, name, messageType: 'px4_msgs/msg/VehicleCommand' });
    t.advertise();
    return t;
  })());
  topic.publish(new ROSLIB.Message({
    timestamp: 0,
    param1: def.param1 ?? 0, param2: 0, param3: 0, param4: 0,
    param5: 0, param6: 0, param7: 0,
    command: def.command,
    target_system: u.idx,          // uav_i 的 MAV_SYS_ID = i（实例号 i-1 + 1）
    target_component: 1,
    source_system: 255, source_component: 0,
    confirmation: 0, from_external: true,
  }));
}

// 卡片按钮（事件委托）
sidebar.addEventListener('click', (e) => {
  const btn = e.target.closest('button[data-a]');
  if (!btn) return;
  const u = uavs[btn.closest('.card')?.dataset.ns];
  if (!u) return;
  const a = btn.dataset.a;
  if (a === 'disarm' && !confirm(`确认对 ${u.ns} 上锁？\n飞行中上锁电机会直接停转！`)) return;
  sendCmd(u, a);
});

// 顶栏全局按钮
document.querySelectorAll('#global-ctl .gbtn').forEach((b) => {
  b.addEventListener('click', () => {
    const online = Object.values(uavs).filter((u) => Date.now() - u.lastSeen < 3000);
    if (!online.length) { alert('当前没有在线飞机'); return; }
    if (!confirm(`确认对 ${online.length} 架在线飞机执行【${b.textContent}】？`)) return;
    online.forEach((u) => sendCmd(u, b.dataset.cmd));
  });
});

function updateCard(u) {
  const f = (k) => u.card.querySelector(`[data-f="${k}"]`);
  if (u.status) {
    const armed = u.status.arming_state === 2;
    const offboard = u.status.nav_state === 14;
    const b = f('badge');
    b.textContent = armed ? '已解锁' : '已上锁';
    b.className = 'badge' + (armed ? ' armed' : '') + (offboard ? ' offboard' : '');
    f('mode').textContent = NAV_STATES[u.status.nav_state] ?? `MODE_${u.status.nav_state}`;
  }
  if (u.battery) {
    const pct = Math.round((u.battery.remaining ?? 0) * 100);
    f('bat').textContent = `${pct} %`;
    f('volt').textContent = `${u.battery.voltage_v.toFixed(2)} V / ${u.battery.current_a.toFixed(2)} A`;
    const fill = f('batfill');
    fill.style.width = `${pct}%`;
    fill.style.background = pct > 50 ? '#3fb950' : pct > 25 ? '#d29922' : '#f85149';
  }
  if (u.pos) {
    const s = sharedNed(u);
    f('pos').textContent = s
      ? `${s.n.toFixed(1)} / ${s.e.toFixed(1)} / ${(-s.d).toFixed(1)} m`
      : `${u.pos.x.toFixed(1)} / ${u.pos.y.toFixed(1)} / ${(-u.pos.z).toFixed(1)} m`;
    const h = Math.hypot(u.pos.vx, u.pos.vy);
    f('vel').textContent = `${h.toFixed(1)} / ${(-u.pos.vz).toFixed(1)} m/s`;
  }
}

// 掉线检测
setInterval(() => {
  for (const u of Object.values(uavs)) {
    u.card.classList.toggle('stale', Date.now() - u.lastSeen > 3000);
  }
}, 1000);

// ============================== 3D 视图 ==============================
const container = document.getElementById('view3d');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0d1117);
scene.fog = new THREE.Fog(0x0d1117, 40, 120);

const camera = new THREE.PerspectiveCamera(55, 1, 0.1, 500);
let camTheta = Math.PI / 4, camPhi = Math.PI / 3.2, camDist = 18;
const camTarget = new THREE.Vector3(0, 1.5, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
container.appendChild(renderer.domElement);

function resize() {
  const w = container.clientWidth, h = container.clientHeight;
  camera.aspect = w / h; camera.updateProjectionMatrix();
  renderer.setSize(w, h); renderer.setPixelRatio(window.devicePixelRatio);
}
window.addEventListener('resize', resize);

// 简易轨道控制: 左键旋转, 右键平移, 滚轮缩放
let drag = null;
renderer.domElement.addEventListener('mousedown', (e) => { drag = { x: e.clientX, y: e.clientY, btn: e.button }; });
window.addEventListener('mouseup', () => drag = null);
window.addEventListener('mousemove', (e) => {
  if (!drag) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  drag.x = e.clientX; drag.y = e.clientY;
  if (drag.btn === 0) {
    camTheta -= dx * 0.005;
    camPhi = Math.min(Math.PI / 2 - 0.05, Math.max(0.1, camPhi - dy * 0.005));
  } else if (drag.btn === 2) {
    const s = camDist * 0.0016;
    const right = new THREE.Vector3(Math.cos(camTheta), 0, -Math.sin(camTheta));
    const fwd = new THREE.Vector3(-Math.sin(camTheta), 0, -Math.cos(camTheta));
    camTarget.addScaledVector(right, -dx * s).addScaledVector(fwd, -dy * s);
  }
});
renderer.domElement.addEventListener('wheel', (e) => {
  camDist = Math.min(100, Math.max(3, camDist * (1 + e.deltaY * 0.001)));
});
renderer.domElement.addEventListener('contextmenu', (e) => e.preventDefault());

// 地面网格与坐标轴 (NED: three.x=东, three.y=上, three.z=-北)
scene.add(new THREE.GridHelper(20, 20, 0x30363d, 0x21262d));
const axes = new THREE.AxesHelper(2); scene.add(axes); // x=红=东, y=绿=上, z=蓝=南
const homeMark = new THREE.Mesh(
  new THREE.CylinderGeometry(0.4, 0.4, 0.02, 32),
  new THREE.MeshBasicMaterial({ color: 0x8b949e, transparent: true, opacity: 0.5 }));
scene.add(homeMark);
scene.add(new THREE.AmbientLight(0xffffff, 0.7));
const dl = new THREE.DirectionalLight(0xffffff, 1.2); dl.position.set(5, 10, 3); scene.add(dl);

// 地理围栏（全息风）：半透明圆柱墙 + 地面实线环 + 旋转虚线扫描环 + 顶环
const fenceMat = new THREE.MeshBasicMaterial({
  color: 0x00e5ff, transparent: true, opacity: 0.06,
  side: THREE.DoubleSide, blending: THREE.AdditiveBlending, depthWrite: false,
});
const fenceWall = new THREE.Mesh(new THREE.CylinderGeometry(FENCE_R, FENCE_R, FENCE_H, 96, 1, true), fenceMat);
fenceWall.position.y = FENCE_H / 2;
scene.add(fenceWall);
const fenceRingPts = [];
for (let i = 0; i <= 128; i++) {
  const a = (i / 128) * Math.PI * 2;
  fenceRingPts.push(new THREE.Vector3(Math.cos(a) * FENCE_R, 0, Math.sin(a) * FENCE_R));
}
const fenceRingGeo = new THREE.BufferGeometry().setFromPoints(fenceRingPts);
const fenceGround = new THREE.Line(fenceRingGeo, new THREE.LineBasicMaterial({ color: 0x00e5ff, transparent: true, opacity: 0.55 }));
fenceGround.position.y = 0.02;
scene.add(fenceGround);
const fenceScan = new THREE.Line(fenceRingGeo.clone(), new THREE.LineDashedMaterial({ color: 0x66ffff, dashSize: 0.8, gapSize: 0.5, transparent: true, opacity: 0.9 }));
fenceScan.computeLineDistances();
fenceScan.position.y = 0.06;
scene.add(fenceScan);
const fenceTop = new THREE.Line(fenceRingGeo.clone(), new THREE.LineBasicMaterial({ color: 0x00e5ff, transparent: true, opacity: 0.25 }));
fenceTop.position.y = FENCE_H;
scene.add(fenceTop);

function ned2three(x, y, z) { return new THREE.Vector3(y, -z, -x); }

// vehicle_local_position 的 x/y 是相对各机自己的 EKF 原点（各机出生点），
// 集群地图必须用 vehicle_global_position 换算到共享平面坐标（公共原点 = 第一架上报的经纬高）
let geoRef = null;
const EARTH_R = 6378137;
function sharedNed(u) {
  if (!u.gpos || !geoRef) return null;
  const dLat = (u.gpos.lat - geoRef.lat) * Math.PI / 180;
  const dLon = (u.gpos.lon - geoRef.lon) * Math.PI / 180;
  return {
    n: dLat * EARTH_R,
    e: dLon * EARTH_R * Math.cos(geoRef.lat * Math.PI / 180),
    d: -(u.gpos.alt - geoRef.alt),
  };
}

function makeLabel(text, cssColor) {
  const c = document.createElement('canvas'); c.width = 256; c.height = 64;
  const g = c.getContext('2d');
  g.font = 'bold 40px sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillStyle = cssColor; g.fillText(text, 128, 32);
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(c), depthTest: false }));
  sp.scale.set(2.2, 0.55, 1);
  return sp;
}

function createMesh(u) {
  const group = new THREE.Group();      // 外层: 只负责位置
  const frame = new THREE.Group();      // 内层: 负责姿态 (local: x=机头, y=右翼, z=下)
  group.add(frame);
  const mat = new THREE.MeshStandardMaterial({ color: u.color });
  // X 型机臂（水平面内）
  const armGeom = new THREE.BoxGeometry(0.9, 0.05, 0.05);
  const arm1 = new THREE.Mesh(armGeom, mat); arm1.rotation.z = Math.PI / 4; frame.add(arm1);
  const arm2 = new THREE.Mesh(armGeom, mat); arm2.rotation.z = -Math.PI / 4; frame.add(arm2);
  // 中心机身
  frame.add(new THREE.Mesh(new THREE.BoxGeometry(0.22, 0.22, 0.08), mat));
  // 四个电机
  const motorGeom = new THREE.CylinderGeometry(0.06, 0.06, 0.08, 12);
  for (const [mx, my] of [[1, 1], [1, -1], [-1, 1], [-1, -1]]) {
    const motor = new THREE.Mesh(motorGeom, mat);
    motor.rotation.x = Math.PI / 2; // 转轴沿 local z
    motor.position.set(mx * 0.318, my * 0.318, 0);
    frame.add(motor);
  }
  // 机头方向指示（白色圆锥，锥尖朝 local +X）
  const nose = new THREE.Mesh(
    new THREE.ConeGeometry(0.08, 0.25, 12),
    new THREE.MeshStandardMaterial({ color: 0xffffff }));
  nose.rotation.z = -Math.PI / 2;
  nose.position.set(0.35, 0, 0);
  frame.add(nose);
  u.frame = frame;
  u.label = makeLabel(u.ns, u.css);     // 标签挂场景，不随姿态翻转
  scene.add(u.label);
  u.mesh = group;
  scene.add(group);

  u.trailGeom = new THREE.BufferGeometry();
  u.trailGeom.setAttribute('position', new THREE.BufferAttribute(new Float32Array(TRAIL_LEN * 3), 3));
  u.trail = new THREE.Line(u.trailGeom, new THREE.LineBasicMaterial({ color: u.color, transparent: true, opacity: 0.55 }));
  u.trail.frustumCulled = false;
  scene.add(u.trail);
}

// PX4 vehicle_attitude.q = [w,x,y,z]，表示机体(FRD) -> NED 的旋转。
// three 坐标系 = M * NED（M: three_x=东, three_y=上=-下, three_z=-北），
// 因此 three 下的旋转矩阵 R' = M * R，即 R' 的三行分别为 R 的第2行、-第3行、-第1行。
const _m4 = new THREE.Matrix4();

function update3D(u) {
  const s = sharedNed(u);
  const p = s ? ned2three(s.n, s.e, s.d) : ned2three(u.pos.x, u.pos.y, u.pos.z);
  u.mesh.position.copy(p);
  u.label.position.set(p.x, p.y + 0.7, p.z);
  u.outFence = Math.hypot(p.x, p.z) > FENCE_R || p.y > FENCE_H;
  if (u.att && u.att.q) {
    const [w, x, y, z] = u.att.q;
    const r00 = 1 - 2 * (y * y + z * z), r01 = 2 * (x * y - z * w),     r02 = 2 * (x * z + y * w);
    const r10 = 2 * (x * y + z * w),     r11 = 1 - 2 * (x * x + z * z), r12 = 2 * (y * z - x * w);
    const r20 = 2 * (x * z - y * w),     r21 = 2 * (y * z + x * w),     r22 = 1 - 2 * (x * x + y * y);
    _m4.set(
       r10,  r11,  r12, 0,
      -r20, -r21, -r22, 0,
      -r00, -r01, -r02, 0,
       0, 0, 0, 1);
    u.frame.quaternion.setFromRotationMatrix(_m4);
  } else {
    u.frame.rotation.set(0, -u.pos.heading, 0); // 姿态数据未到时只用航向
  }
  const last = u.trailPts[u.trailPts.length - 1];
  if (!last || last.distanceTo(p) > 0.05) {
    u.trailPts.push(p.clone());
    if (u.trailPts.length > TRAIL_LEN) u.trailPts.shift();
    const arr = u.trailGeom.attributes.position.array;
    u.trailPts.forEach((pt, i) => { arr[i * 3] = pt.x; arr[i * 3 + 1] = pt.y; arr[i * 3 + 2] = pt.z; });
    u.trailGeom.setDrawRange(0, u.trailPts.length);
    u.trailGeom.attributes.position.needsUpdate = true;
  }
}

function animate() {
  requestAnimationFrame(animate);
  // 围栏动效：呼吸脉冲 + 虚线环旋转扫描；有飞机越界时整体变红快闪
  const t = performance.now() * 0.001;
  const breach = Object.values(uavs).some((u) => u.outFence);
  if (breach) {
    fenceMat.color.setHex(0xff3355);
    fenceMat.opacity = 0.10 + 0.08 * Math.abs(Math.sin(t * 8));
  } else {
    fenceMat.color.setHex(0x00e5ff);
    fenceMat.opacity = 0.05 + 0.03 * Math.sin(t * 2);
  }
  fenceScan.rotation.y = t * 0.4;
  fenceScan.material.color.setHex(breach ? 0xff5566 : 0x66ffff);
  camera.position.set(
    camTarget.x + camDist * Math.sin(camPhi) * Math.sin(camTheta),
    camTarget.y + camDist * Math.cos(camPhi),
    camTarget.z + camDist * Math.sin(camPhi) * Math.cos(camTheta));
  camera.lookAt(camTarget);
  renderer.render(scene, camera);
}
resize();
animate();
</script>
