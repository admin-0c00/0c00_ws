<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>SwarmCore 地面站</title>
<link rel="icon" type="image/x-icon" href="favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="favicon_32.png">
<link rel="stylesheet" href="lib/uplot.min.css">
<script src="lib/roslib.min.js"></script>
<script src="lib/three.min.js"></script>
<script src="lib/uplot.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #0d1117; color: #e6edf3; font-family: "PingFang SC", "Microsoft YaHei", sans-serif; overflow: hidden; }
  #header { display: flex; align-items: center; gap: 12px; padding: 8px 16px; background: #161b22; border-bottom: 1px solid #30363d; }
  #header img#logo { height: 22px; display: block; }
  #copyright { font-size: 11px; color: #586069; margin-left: 8px; white-space: nowrap; }
  #header h1 { font-size: 16px; font-weight: 600; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: #f85149; }
  .dot.ok { background: #3fb950; }
  #conn-text { font-size: 13px; color: #8b949e; }
  #main { display: flex; height: calc(100vh - 41px); }
  #sidebar { width: 340px; min-width: 340px; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 10px; background: #0d1117; }
  #view3d { flex: 1; position: relative; }
  #view3d canvas { display: block; }
  #hint { position: absolute; bottom: 10px; left: 12px; font-size: 12px; color: #8b949e; user-select: none; }
  #fence-alert { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); background: rgba(248, 81, 73, 0.92); color: #fff; font-size: 14px; font-weight: 600; padding: 8px 20px; border-radius: 8px; opacity: 0; transition: opacity 0.3s; pointer-events: none; }
  #fence-alert.show { opacity: 1; }
  #cmd-toast { position: fixed; right: 16px; bottom: 16px; background: rgba(33, 38, 45, 0.95); color: #c9d1d9; border: 1px solid #30363d; border-radius: 8px; padding: 8px 16px; font-size: 13px; opacity: 0; transition: opacity 0.2s; pointer-events: none; z-index: 99; }
  #cmd-toast.show { opacity: 1; }
  #cmd-toast.ok { border-color: #2ea043; color: #3fb950; }
  #cmd-toast.err { border-color: #da3633; color: #f85149; }
  .gbtn:disabled, .cbtn:disabled { opacity: 0.45; cursor: wait; }
  .card { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 10px 12px; }
  .card.stale { opacity: 0.45; }
  .card-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .card-title { font-size: 15px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
  .color-chip { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
  .badge { font-size: 12px; padding: 2px 8px; border-radius: 10px; background: #30363d; color: #8b949e; }
  .badge.armed { background: #9e3a3a; color: #ffb3b3; }
  .badge.offboard { background: #1f6feb; color: #cfe5ff; }
  .kv { display: grid; grid-template-columns: 84px 1fr; row-gap: 3px; font-size: 13px; }
  .kv .k { color: #8b949e; }
  .kv .v { font-family: "JetBrains Mono", Consolas, monospace; }
  .bat-bar { height: 8px; border-radius: 4px; background: #30363d; overflow: hidden; margin-top: 4px; }
  .bat-fill { height: 100%; border-radius: 4px; transition: width 0.4s; }
  #empty { color: #8b949e; font-size: 13px; text-align: center; margin-top: 30px; }
  #global-ctl { margin-left: auto; display: flex; gap: 8px; }
  .gbtn, .cbtn { background: #0d2740; color: #58d6ff; border: 1px solid #1c4a6e; border-radius: 6px; padding: 4px 12px; font-size: 12px; cursor: pointer; transition: background 0.15s; }
  .gbtn:hover, .cbtn:hover { background: #144a75; }
  .gbtn.danger, .cbtn.danger { background: #3a1a1a; color: #ff8a80; border-color: #6e2b2b; }
  .gbtn.danger:hover, .cbtn.danger:hover { background: #5c2424; }
  .ctl-row { display: flex; gap: 6px; margin-top: 8px; }
  .ctl-row .cbtn { flex: 1; padding: 4px 0; }
  #fence-ctl, #takeoff-ctl, #coord-ctl { font-size: 12px; color: #8b949e; display: flex; align-items: center; gap: 6px; }
  #fence-action, #coord-mode { background: #0d2740; color: #58d6ff; border: 1px solid #1c4a6e; border-radius: 6px; padding: 3px 6px; font-size: 12px; }
  #takeoff-alt { background: #0d2740; color: #58d6ff; border: 1px solid #1c4a6e; border-radius: 6px; padding: 3px 6px; font-size: 12px; width: 58px; }
  .tab-bar { display: flex; gap: 6px; }
  .tab-btn { flex: 1; background: #161b22; color: #8b949e; border: 1px solid #30363d; border-radius: 6px; padding: 5px 0; font-size: 13px; cursor: pointer; }
  .tab-btn.active { background: #0d2740; color: #58d6ff; border-color: #1c4a6e; }
  #tab-record, #tab-data { display: none; }
  .bag-card { background: #0d1117; border: 1px solid #30363d; border-radius: 6px; padding: 8px 10px; margin-top: 8px; }
  .bag-card .bag-title { font-size: 12px; font-weight: 600; font-family: "JetBrains Mono", Consolas, monospace; color: #c9d1d9; }
  .bag-card .bag-meta { font-size: 11px; color: #8b949e; margin: 3px 0; white-space: pre-wrap; word-break: break-all; }
  .bag-card .bag-note { font-size: 11px; color: #d29922; }
  .bag-ops { display: flex; gap: 5px; margin-top: 6px; flex-wrap: wrap; }
  .bag-ops .cbtn { padding: 3px 8px; font-size: 12px; }
  .bag-ops a.dl { color: #3fb950; font-size: 12px; align-self: center; text-decoration: none; border: 1px solid #2ea043; border-radius: 6px; padding: 3px 8px; }
  .bag-playing { color: #f85149; font-size: 11px; }
  .bag-topic-sel { background: #0d2740; color: #58d6ff; border: 1px solid #1c4a6e; border-radius: 6px; padding: 2px 4px; font-size: 11px; max-width: 150px; }
  #chart-panel { position: absolute; left: 12px; bottom: 34px; width: 560px; max-width: 70%; background: rgba(22, 27, 34, 0.96); border: 1px solid #30363d; border-radius: 8px; padding: 8px 12px; z-index: 50; }
  #chart-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
  #chart-head h3 { font-size: 12px; color: #c9d1d9; font-family: "JetBrains Mono", Consolas, monospace; word-break: break-all; }
  #chart-close { background: none; border: none; color: #8b949e; cursor: pointer; font-size: 14px; padding: 0 4px; }
  #chart-fields { display: flex; flex-wrap: wrap; gap: 3px 12px; font-size: 11px; max-height: 66px; overflow-y: auto; margin-bottom: 4px; }
  #chart-fields label { color: #8b949e; display: flex; gap: 3px; align-items: center; cursor: pointer; }
  .rec-card { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 10px 12px; font-size: 13px; }
  .rec-card h3 { font-size: 13px; margin-bottom: 6px; }
  .rec-ns { font-size: 12px; font-weight: 600; margin-top: 6px; }
  .rec-topic { display: flex; align-items: center; gap: 6px; font-size: 12px; font-family: "JetBrains Mono", Consolas, monospace; padding: 1px 0; color: #8b949e; }
  #rec-status { font-size: 12px; color: #8b949e; margin-top: 8px; white-space: pre-wrap; word-break: break-all; }
  #rec-status.rec-on { color: #f85149; }
  #goto-toggle.on { background: #144a75; border-color: #58d6ff; box-shadow: 0 0 6px rgba(88, 214, 255, 0.5); }
  #view3d.goto-mode canvas { cursor: crosshair; }
  .card.selected { border-color: #58d6ff; box-shadow: 0 0 6px rgba(88, 214, 255, 0.35); }
  .rec-presets { display: flex; gap: 6px; margin: 6px 0; }
  .rec-presets .cbtn { flex: 1; padding: 3px 0; font-size: 12px; }
  #rec-note { width: 100%; background: #0d2740; color: #e6edf3; border: 1px solid #1c4a6e; border-radius: 6px; padding: 5px 8px; font-size: 12px; margin-top: 8px; }
  .bag-row { display: flex; align-items: center; gap: 6px; font-size: 11px; font-family: "JetBrains Mono", Consolas, monospace; padding: 2px 0; color: #8b949e; }
  .bag-row .bag-name { flex: 1; color: #c9d1d9; }
  .bag-row .bag-del { background: none; border: none; color: #f85149; cursor: pointer; font-size: 12px; padding: 0 2px; }
  #rec-total { font-size: 11px; color: #586069; margin-top: 6px; }
</style>
</head>
<body>
<div id="header">
  <img id="logo" src="logo.png" alt="0C∞">
  <h1>SwarmCore 地面站</h1>
  <div class="dot" id="conn-dot"></div>
  <span id="conn-text">连接 rosbridge...</span>
  <div id="global-ctl">
    <button class="gbtn" id="goto-toggle" title="打开后单击 3D 地面，选中的飞机即飞向该点">指点飞行</button>
    <button class="gbtn" id="trail-clear" title="清除所有飞机的飞行轨迹">清除轨迹</button>
    <button class="gbtn" data-cmd="takeoff">全部起飞</button>
    <button class="gbtn" data-cmd="rtl">全部返航</button>
    <button class="gbtn" data-cmd="land">全部降落</button>
    <button class="gbtn danger" data-cmd="disarm" title="全部上锁电机（锁桨），飞行中会强制停桨">全部上锁电机</button>
    <label id="coord-ctl">坐标系:
      <select id="coord-mode">
        <option value="gps" selected>GPS 共享</option>
        <option value="local">本机/UWB</option>
      </select>
    </label>
    <label id="fence-ctl">围栏动作:
      <select id="fence-action">
        <option value="off">关闭</option>
        <option value="hold">悬停</option>
        <option value="land">降落</option>
        <option value="rtl" selected>返航</option>
      </select>
    </label>
    <label id="takeoff-ctl">起飞高度:
      <input id="takeoff-alt" type="number" value="1.5" step="0.5" min="0.5" max="50"> m
    </label>
    <span id="copyright">© 零创无穷</span>
  </div>
</div>
<div id="main">
  <div id="sidebar">
    <div class="tab-bar">
      <button class="tab-btn active" id="tab-btn-status">状态</button>
      <button class="tab-btn" id="tab-btn-record">记录</button>
      <button class="tab-btn" id="tab-btn-data">数据</button>
    </div>
    <div id="tab-status"><div id="empty">等待无人机数据…<br>请先启动仿真 (start_swarm_sim.sh)</div></div>
    <div id="tab-record">
      <div class="rec-card">
        <h3>选择要记录的话题（只录勾选项，控制磁盘占用）</h3>
        <div class="rec-presets">
          <button class="cbtn" id="rec-preset-std">评估标准集</button>
          <button class="cbtn" id="rec-preset-all">全选</button>
          <button class="cbtn" id="rec-preset-none">清空</button>
          <button class="cbtn" id="rec-refresh">刷新话题</button>
        </div>
        <div id="rec-topics"><div style="color:#8b949e;font-size:12px">正在获取话题列表…（若无结果请确认仿真/真机已启动，点"刷新话题"重试）</div></div>
        <input id="rec-note" type="text" maxlength="200" placeholder="实验备注（可选，写入 bag 的 metadata.json）">
        <div class="ctl-row" style="margin-top:10px">
          <button class="cbtn" id="rec-start">开始记录</button>
          <button class="cbtn danger" id="rec-stop" disabled>停止</button>
        </div>
        <div id="rec-status">未在记录</div>
      </div>
      <div class="rec-card">
        <h3>历史记录</h3>
        <div id="rec-bags"><div style="color:#586069;font-size:12px">暂无记录</div></div>
        <div id="rec-total"></div>
      </div>
    </div>
    <div id="tab-data">
      <div class="rec-card">
        <h3>数据分析与日志回放</h3>
        <div style="font-size:12px;color:#8b949e">回放会把历史数据发回同名话题，地面站将"情景重现"。<b style="color:#d29922">回放前请先停止仿真/真机。</b></div>
        <div id="data-bags"><div style="color:#586069;font-size:12px;margin-top:8px">暂无记录</div></div>
        <div id="rec-total2"></div>
      </div>
    </div>
  </div>
  <div id="view3d"><div id="hint">左键拖拽旋转 · 滚轮缩放 · 右键拖拽平移 | 网格 1m · 北 = -Z 方向 · 青色圆柱 = 地理围栏 R10m × H6m（圆心 = uav_1 原点）</div><div id="fence-alert"></div><div id="cmd-toast"></div><div id="chart-panel" style="display:none"><div id="chart-head"><h3 id="chart-title">数据曲线</h3><button id="chart-close" title="关闭">✕</button></div><div id="chart-fields"></div><div id="chart-plot"></div></div></div>
</div>

<script>
// ============================== 配置 ==============================
// 走与页面同端口的 /ws 中转（web_server.py 转发到 rosbridge:9090），
// 避免 9090 被中间网络设备拦截
const ROSBRIDGE_URL = `ws://${location.host}/ws`;
const MAX_UAV = 6;
const COLORS = [0xff5252, 0x4caf50, 0x42a5f5, 0xff9800, 0xab47bc, 0x26c6da];
const CSS_COLORS = ['#ff5252', '#4caf50', '#42a5f5', '#ff9800', '#ab47bc', '#26c6da'];
const NAV_STATES = {
  0: 'MANUAL', 1: 'ALTITUDE', 2: 'POSITION', 3: 'AUTO_MISSION', 4: 'HOLD',
  5: 'AUTO_RTL', 6: 'POSITION_SLOW', 10: 'ACRO', 14: 'OFFBOARD',
  15: 'STABILIZED', 17: 'AUTO_TAKEOFF', 18: 'AUTO_LAND', 19: 'AUTO_FOLLOW_TARGET',
};
const TRAIL_LEN = 600;
const FENCE_R = 10;   // 地理围栏半径 (m)，以共享原点为圆心
const FENCE_H = 6;    // 围栏可视化高度 (m)

// ============================== 状态 ==============================
const uavs = {}; // ns -> {status, battery, pos, lastSeen, card, mesh, label, trail...}
const ros = new ROSLIB.Ros({ url: ROSBRIDGE_URL });

ros.on('connection', () => { setConn(true); setupRos(); });
ros.on('close', () => { setConn(false); setTimeout(() => ros.connect(ROSBRIDGE_URL), 2000); });
ros.on('error', () => setConn(false));

function setConn(ok) {
  document.getElementById('conn-dot').className = ok ? 'dot ok' : 'dot';
  document.getElementById('conn-text').textContent = ok ? 'rosbridge 已连接' : 'rosbridge 断开, 重连中…';
}

// ============================== 订阅 ==============================
// 每次连接（含重连）都要重建全部订阅与发布者——roslib 不会自动恢复
function setupRos() {
  for (let i = 1; i <= MAX_UAV; i++) {
    const ns = `uav_${i}`;
    sub(ns, 'vehicle_status', 'px4_msgs/msg/VehicleStatus', (m) => {
      const u = getUav(ns, i);
      u.status = m; u.lastSeen = Date.now(); updateCard(u);
    }, 500);
    sub(ns, 'battery_status', 'px4_msgs/msg/BatteryStatus', (m) => {
      const u = getUav(ns, i);
      u.battery = m; u.lastSeen = Date.now(); updateCard(u);
    }, 500);
    sub(ns, 'vehicle_local_position', 'px4_msgs/msg/VehicleLocalPosition', (m) => {
      const u = getUav(ns, i);
      // GPS 共享模式的坐标原点 = uav_1 的 EKF 原点（起始位置）
      if (!geoRef && ns === 'uav_1' && m.xy_global && m.ref_lat) {
        geoRef = { lat: m.ref_lat, lon: m.ref_lon, alt: m.ref_alt };
      }
      u.pos = m; u.lastSeen = Date.now(); updateCard(u); update3D(u);
    }, 100);
    sub(ns, 'vehicle_attitude', 'px4_msgs/msg/VehicleAttitude', (m) => {
      const u = getUav(ns, i);
      u.att = m; u.lastSeen = Date.now();
      if (u.pos) update3D(u);
    }, 100);
    sub(ns, 'vehicle_global_position', 'px4_msgs/msg/VehicleGlobalPosition', (m) => {
      const u = getUav(ns, i);
      u.gpos = m; u.lastSeen = Date.now();   // GPS 共享模式的经纬度来源
      if (u.pos) { updateCard(u); update3D(u); }
    }, 200);
  }
  // 记录状态订阅（可记录话题列表也随该状态下发）
  new ROSLIB.Topic({ ros, name: '/recorder/status', messageType: 'std_msgs/msg/String' }).subscribe(recStatusHandler);
  // 数据曲线结果
  new ROSLIB.Topic({ ros, name: '/recorder/series', messageType: 'std_msgs/msg/String' }).subscribe(seriesHandler);
  // 发布者在新连接上重新注册
  recConfigTopic.advertise();
  Object.values(cmdTopics).forEach((t) => t.advertise());
}

// 话题限流: PX4 多数话题 ~100Hz，全速转发会把 rosbridge 的 JSON 序列化压垮（100% CPU 饿死），
// 显示端 10Hz/2Hz 足够，throttle_rate 单位 ms
function sub(ns, topic, type, cb, throttle = 100) {
  new ROSLIB.Topic({
    ros, name: `/${ns}/fmu/out/${topic}`, messageType: type,
    throttle_rate: throttle, queue_length: 1,
  }).subscribe(cb);
}

function getUav(ns, idx) {
  if (!uavs[ns]) {
    uavs[ns] = { ns, idx, color: COLORS[(idx - 1) % COLORS.length], css: CSS_COLORS[(idx - 1) % CSS_COLORS.length], trailPts: [] };
    createCard(uavs[ns]); createMesh(uavs[ns]);
    document.getElementById('empty')?.remove();
    if (!selectedNs) selectUav(ns);   // 首架上线飞机默认选中（指点飞行目标）
  }
  return uavs[ns];
}

// ============================== 状态卡片 ==============================
// 卡片都挂在“状态”标签页内，事件委托也绑在它上面
const sidebar = document.getElementById('tab-status');

function createCard(u) {
  const el = document.createElement('div');
  el.className = 'card';
  el.dataset.ns = u.ns;
  el.innerHTML = `
    <div class="card-head">
      <div class="card-title"><span class="color-chip" style="background:${u.css}"></span>${u.ns}</div>
      <span class="badge" data-f="badge">待机</span>
    </div>
    <div class="kv">
      <span class="k">飞行模式</span><span class="v" data-f="mode">-</span>
      <span class="k">电量</span><span class="v" data-f="bat">-</span>
      <span class="k">电压/电流</span><span class="v" data-f="volt">-</span>
      <span class="k">位置 N/E/高</span><span class="v" data-f="pos">-</span>
      <span class="k">速度 水平/垂直</span><span class="v" data-f="vel">-</span>
    </div>
    <div class="bat-bar"><div class="bat-fill" data-f="batfill" style="width:0%;background:#3fb950"></div></div>
    <div class="ctl-row">
      <button class="cbtn" data-a="arm" title="解锁电机（不起飞）">解锁电机</button>
      <button class="cbtn" data-a="takeoff" title="起飞到设定高度">起飞</button>
      <button class="cbtn" data-a="rtl" title="返航并自动降落">返航</button>
      <button class="cbtn" data-a="land" title="原地降落">降落</button>
      <button class="cbtn danger" data-a="disarm" title="上锁电机（锁桨）。飞行中会强制停桨！">上锁电机</button>
    </div>`;
  sidebar.appendChild(el);
  u.card = el;
}

// ============================== 控制指令 ==============================
// 按钮指令走可靠通道：后端 web_control_node（基于 swarm_api）执行，
// 命令自动重发 + 飞控状态确认 + 结果回执；围栏自动动作仍走原直发通道（飞控 GF_* 是主保险）。
// MAVLink 命令: 400=ARM_DISARM, 22=NAV_TAKEOFF, 20=NAV_RTL, 21=NAV_LAND
const MAV_CMDS = {
  arm:     { command: 400, param1: 1 },
  disarm:  { command: 400, param1: 0 },
  takeoff: { command: 22 },
  rtl:     { command: 20 },
  land:    { command: 21 },
  hold:    { command: 17 },   // NAV_LOITER_UNLIM -> 切 Hold
};
const FENCE_ACTION_NAMES = { hold: '悬停', land: '降落', rtl: '返航' };
const ACTION_NAMES = { arm: '解锁电机', disarm: '上锁电机', takeoff: '起飞', land: '降落', rtl: '返航', hover: '悬停', goto: '指点飞行' };
const cmdTopics = {};

// ---------- 可靠通道（按钮） ----------
const webCmdTopic = new ROSLIB.Topic({ ros, name: '/web_control/cmd', messageType: 'std_msgs/msg/String' });
webCmdTopic.advertise();
new ROSLIB.Topic({ ros, name: '/web_control/result', messageType: 'std_msgs/msg/String' })
  .subscribe((m) => {
    let r; try { r = JSON.parse(m.data); } catch { return; }
    finishCmd(r);
  });

let cmdSeq = 0;
const pendingCmds = {};   // id -> { desc, btns: Set, timer }

function sendCmd(u, action, btn, extra) {
  const id = ++cmdSeq;
  const payload = { id, ns: u.ns, action, ...(extra || {}) };
  if (action === 'takeoff') payload.alt = parseFloat(document.getElementById('takeoff-alt').value) || 1.5;
  const p = { desc: `${u.ns} ${ACTION_NAMES[action] || action}`, btns: new Set(), timer: null, marker: null };
  if (btn) { p.btns.add(btn); btn.disabled = true; }
  p.timer = setTimeout(() => finishCmd({ id, ok: false, msg: '后端无响应（web_control_node 未运行？）' }), 60000);
  pendingCmds[id] = p;
  webCmdTopic.publish(new ROSLIB.Message({ data: JSON.stringify(payload) }));
  showToast(`${p.desc} 执行中…`, null);
  return id;
}

function finishCmd(r) {
  const p = pendingCmds[r.id];
  if (!p) return;
  clearTimeout(p.timer);
  delete pendingCmds[r.id];
  p.btns.forEach((b) => { b.disabled = false; });
  if (p.marker) { scene.remove(p.marker); p.marker = null; }   // 指点飞行目标标记
  showToast(`${p.desc}${r.ok ? ' 成功 ✔' : ' 失败: ' + r.msg}`, r.ok);
}

// ---------- 直发通道（围栏自动动作保留） ----------
function sendFenceCmd(u, action) {
  const def = MAV_CMDS[action];
  if (def) publishCmd(u, def);
}

function publishCmd(u, def) {
  const name = `/${u.ns}/fmu/in/vehicle_command`;
  const topic = cmdTopics[name] || (cmdTopics[name] = (() => {
    const t = new ROSLIB.Topic({ ros, name, messageType: 'px4_msgs/msg/VehicleCommand' });
    t.advertise();
    return t;
  })());
  topic.publish(new ROSLIB.Message({
    timestamp: 0,
    param1: def.param1 ?? 0, param2: 0, param3: 0, param4: 0,
    param5: 0, param6: 0, param7: def.param7 ?? 0,
    command: def.command,
    target_system: u.idx,          // uav_i 的 MAV_SYS_ID = i（实例号 i-1 + 1）
    target_component: 1,
    source_system: 255, source_component: 0,
    confirmation: 0, from_external: true,
  }));
}

function updateCard(u) {
  const f = (k) => u.card.querySelector(`[data-f="${k}"]`);
  if (u.status) {
    const armed = u.status.arming_state === 2;
    const offboard = u.status.nav_state === 14;

    b.textContent = armed ? '已解锁' : '已上锁';
    b.className = 'badge' + (armed ? ' armed' : '') + (offboard ? ' offboard' : '');
    f('mode').textContent = NAV_STATES[u.status.nav_state] ?? `MODE_${u.status.nav_state}`;
  }
  if (u.battery) {
    const pct = Math.round((u.battery.remaining ?? 0) * 100);
    f('bat').textContent = `${pct} %`;
    f('volt').textContent = `${u.battery.voltage_v.toFixed(2)} V / ${u.battery.current_a.toFixed(2)} A`;
    const fill = f('batfill');
    fill.style.width = `${pct}%`;
    fill.style.background = pct > 50 ? '#3fb950' : pct > 25 ? '#d29922' : '#f85149';
  }
  if (u.pos) {
    const ne = uavNe(u);
    f('pos').textContent = `${ne.n.toFixed(1)} / ${ne.e.toFixed(1)} / ${(-u.pos.z).toFixed(1)} m`;
    const h = Math.hypot(u.pos.vx, u.pos.vy);
    f('vel').textContent = `${h.toFixed(1)} / ${(-u.pos.vz).toFixed(1)} m/s`;
  }
}

// 记录页: 勾选话题 -> /recorder/config (JSON) -> recorder_node 起 ros2 bag record
// 话题列表不写死：recorder_node 周期性枚举"有发布者"的话题随状态下发
// （只订阅不发布的幽灵话题录了也是空的；新话题上线 10s 内自动出现），勾选存 localStorage。
const REC_PRESET_STD = ['vehicle_status', 'vehicle_local_position', 'battery_status'];
const recConfigTopic = new ROSLIB.Topic({ ros, name: '/recorder/config', messageType: 'std_msgs/msg/String' });
let recAllTopics = [];   // [{name, type}]，来自 /recorder/status 的 rec_topics
let recTopicsSig = '';

function recSavedSet() {
  try { return new Set(JSON.parse(localStorage.getItem('recTopics') || '[]')); } catch { return new Set(); }
}

function renderRecTopics() {
  const box = document.getElementById('rec-topics');
  if (!recAllTopics.length) {
    box.innerHTML = '<div style="color:#8b949e;font-size:12px">未发现话题（仿真/真机是否启动？）— 点"刷新话题"重试</div>';
    return;
  }
  const saved = recSavedSet();
  const isStd = (n) => REC_PRESET_STD.some((s) => n.endsWith('/' + s));
  const groups = {};
  for (const t of recAllTopics) {
    const g = t.name.split('/')[1] || 'other';
    (groups[g] = groups[g] || []).push(t);
  }
  box.innerHTML = Object.keys(groups)
    .sort((a, b) => a.localeCompare(b, undefined, { numeric: true }))
    .map((g) => `<div class="rec-ns">${g}</div>` + groups[g].map((t) => {
      const checked = saved.size ? saved.has(t.name) : isStd(t.name);   // 无历史选择时默认标准集
      const warn = /Image|PointCloud/.test(t.type) ? ' <span style="color:#d29922">⚠大流量</span>' : '';
      return `<label class="rec-topic"><input type="checkbox" ${checked ? 'checked' : ''} data-topic="${t.name}"> ${t.name.slice(g.length + 2)}${warn}</label>`;
    }).join('')).join('');
}

function recStatusHandler(m) {
  try {

// ============================== 数据页（分析与回放） ==============================
let lastExportToast = null;
let dataPageSig = '';
function renderDataPage(st) {
  // 内容没变不重渲染：1Hz 状态刷新会重建卡片 HTML，把刚点开的下拉框销毁（实测 bug）
  const sig = JSON.stringify([
    (st.bags || []).map((b) => [b.name, b.dur, b.msgs, b.note, (b.topics || []).length]),
    st.playing, st.playing_name, st.exporting,
    st.last_export && st.last_export.ok ? st.last_export.name : null,
  ]);
  if (sig === dataPageSig) return;
  dataPageSig = sig;
  // 导出完成时提示一次
  if (st.last_export && st.last_export.ok) {
    const key = st.last_export.name + st.last_export.zip;
    if (key !== lastExportToast) {
      lastExportToast = key;
      showToast(`${st.last_export.name} 导出完成 ✔ 点卡片里的"下载 CSV"`, true);
    }
  }
  const box = document.getElementById('data-bags');
  const bags = st.bags || [];
  if (!bags.length) {
    box.innerHTML = '<div style="color:#586069;font-size:12px;margin-top:8px">暂无记录（先在"记录"页录制）</div>';
  } else {
    box.innerHTML = bags.map((b) => {
      const playing = st.playing && st.playing_name === b.name;
      const exporting = st.exporting === b.name;
      const meta = [b.dur != null ? `时长 ${b.dur}s` : null,
                    b.msgs != null ? `${b.msgs} 条` : null,
                    `${b.mb} MB`].filter(Boolean).join(' · ');
      const dl = (st.last_export && st.last_export.ok && st.last_export.name === b.name)
        ? `<a class="dl" href="/bags/${st.last_export.zip}" download>⬇ 下载 CSV (${st.last_export.topics} 话题)</a>` : '';
      return `<div class="bag-card">
        <div class="bag-title">${b.name} ${playing ? '<span class="bag-playing">● 回放中</span>' : ''}</div>
        <div class="bag-meta">${meta}</div>
        ${b.note ? `<div class="bag-note">备注: ${b.note}</div>` : ''}
        <div class="bag-ops">
          <select class="bag-topic-sel" data-bag="${b.name}">${(b.topics || []).map((t) => `<option value="${t}">${t.split('/').pop()}</option>`).join('')}</select>
          <button class="cbtn" data-act="view" data-bag="${b.name}">查看数据</button>
          ${playing ? `<button class="cbtn danger" data-act="play_stop" data-bag="${b.name}">停止回放</button>`
                    : `<button class="cbtn" data-act="play" data-bag="${b.name}" ${st.playing ? 'disabled' : ''}>回放</button>`}
          <button class="cbtn" data-act="export_csv" data-bag="${b.name}" ${exporting ? 'disabled' : ''}>${exporting ? '导出中…' : '导出 CSV'}</button>
          ${dl}
          <button class="cbtn danger" data-act="delete" data-bag="${b.name}">删除</button>
        </div>
      </div>`;
    }).join('');
  }
  document.getElementById('rec-total2').textContent =
    st.total_mb > 0 ? `bags 目录总占用 ${st.total_mb} MB` : '';
}

// ============================== 数据曲线（uPlot，离线库） ==============================
let chartData = null, chartObj = null, chartTimer = null, chartReq = null;

function viewSeries(bagName, topic, attempt) {
  attempt = attempt || 1;
  chartReq = { bagName, topic, attempt };
  document.getElementById('chart-panel').style.display = 'block';
  document.getElementById('chart-title').textContent =
    `${bagName} · ${topic}（加载中…${attempt > 1 ? ' 重试' + (attempt - 1) : ''}）`;
  document.getElementById('chart-fields').innerHTML = '';
  if (attempt === 1) {
    if (chartObj) { chartObj.destroy(); chartObj = null; }
    document.getElementById('chart-plot').innerHTML = '';
  }
  clearTimeout(chartTimer);
  // 连接闪断会丢一次性结果（rosbridge 按订阅代际投递），自动重试 2 次再报错
  chartTimer = setTimeout(() => {
    if (chartReq && chartReq.attempt < 3) {
      viewSeries(chartReq.bagName, chartReq.topic, chartReq.attempt + 1);
    } else {
      document.getElementById('chart-title').textContent = '加载超时：请检查 rosbridge 连接后重试';
      showToast('曲线加载超时', false);
    }
  }, 10000);
  recConfigTopic.publish(new ROSLIB.Message({ data: JSON.stringify({ action: 'series', name: bagName, topic }) }));
}

document.getElementById('chart-close').addEventListener('click', () => {
  document.getElementById('chart-panel').style.display = 'none';
});

function seriesHandler(m) {
  let d; try { d = JSON.parse(m.data); } catch { return; }
  clearTimeout(chartTimer);
  chartReq = null;
  if (!d.ok) {
    document.getElementById('chart-title').textContent = `加载失败: ${d.msg}`;
    showToast(`曲线读取失败: ${d.msg}`, false);
    return;
  }
  // 大数据走 HTTP 下载（rosbridge 只发就绪通知，避免 DDS best-effort 丢大消息）
  if (d.url) {
    document.getElementById('chart-title').textContent = `已就绪 ${d.rows} 点，下载中…`;
    fetch(d.url).then((r) => r.json()).then((full) => {
      renderSeries({ name: d.name, topic: d.topic, rows: d.rows, t: full.t, series: full.series });
    }).catch((e) => {
      document.getElementById('chart-title').textContent = `下载失败: ${e}`;
    });
    return;
  }
  renderSeries(d);   // 兼容直接带数据的旧格式
}

function renderSeries(d) {
  document.getElementById('chart-title').textContent = `已收到 ${d.rows} 点，绘图中…`;   // 调试埋点：区分"没收到"和"绘图崩"
  chartData = d;
  const t0 = d.t[0] || 0;
  chartData.rel = d.t.map((t) => +(t - t0).toFixed(3));
  document.getElementById('chart-title').textContent = `${d.name} · ${d.topic}（${d.rows} 点）`;
  const names = Object.keys(d.series);
  document.getElementById('chart-fields').innerHTML = names.map((f, i) =>
    `<label><input type="checkbox" data-f="${f}" ${i < 3 ? 'checked' : ''}> ${f}</label>`).join('');
  drawChart();
}

document.getElementById('chart-fields').addEventListener('change', drawChart);

const CHART_COLS = ['#58d6ff', '#3fb950', '#f85149', '#d29922', '#bc8cff', '#39c5cf', '#ff7b72', '#7ee787'];

  if (!chartData) return;

    axes: [
      { stroke: '#8b949e', grid: { stroke: '#21262d' }, ticks: { stroke: '#30363d' } },
      { stroke: '#8b949e', grid: { stroke: '#21262d' }, ticks: { stroke: '#30363d' } },

const container = document.getElementById('view3d');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0d1117);
scene.fog = new THREE.Fog(0x0d1117, 40, 120);

const camera = new THREE.PerspectiveCamera(55, 1, 0.1, 500);
let camTheta = Math.PI / 4, camPhi = Math.PI / 3.2, camDist = 18;
const camTarget = new THREE.Vector3(0, 1.5, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
container.appendChild(renderer.domElement);

function resize() {
  const w = container.clientWidth, h = container.clientHeight;
  camera.aspect = w / h; camera.updateProjectionMatrix();
  renderer.setSize(w, h); renderer.setPixelRatio(window.devicePixelRatio);
}
window.addEventListener('resize', resize);

// 简易轨道控制: 左键旋转, 右键平移, 滚轮缩放
let drag = null;
renderer.domElement.addEventListener('mousedown', (e) => { drag = { x: e.clientX, y: e.clientY, btn: e.button }; });
window.addEventListener('mouseup', () => drag = null);
window.addEventListener('mousemove', (e) => {
  if (!drag) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  drag.x = e.clientX; drag.y = e.clientY;
  if (drag.btn === 0) {
    camTheta -= dx * 0.005;
    camPhi = Math.min(Math.PI / 2 - 0.05, Math.max(0.1, camPhi - dy * 0.005));
  } else if (drag.btn === 2) {
    const s = camDist * 0.0016;
    const right = new THREE.Vector3(Math.cos(camTheta), 0, -Math.sin(camTheta));
    const fwd = new THREE.Vector3(-Math.sin(camTheta), 0, -Math.cos(camTheta));
    camTarget.addScaledVector(right, -dx * s).addScaledVector(fwd, -dy * s);
  }
});
renderer.domElement.addEventListener('wheel', (e) => {
  camDist = Math.min(100, Math.max(3, camDist * (1 + e.deltaY * 0.001)));
});
renderer.domElement.addEventListener('contextmenu', (e) => e.preventDefault());

// ============================== 指点飞行 ==============================
// 打开"指点飞行"后单击 3D 地面：射线与等高水平面求交得到 ENU 目标点，
// 换算到选中飞机的本地系后经 web_control_node 执行 Drone.goto()。
const gotoToggle = document.getElementById('goto-toggle');
let gotoMode = false;
gotoToggle.addEventListener('click', () => {
  gotoMode = !gotoMode;
  gotoToggle.classList.toggle('on', gotoMode);
  container.classList.toggle('goto-mode', gotoMode);
  showToast(gotoMode ? '指点飞行已开启：点击卡片选飞机，再单击地面' : '指点飞行已关闭', gotoMode);
});

const raycaster = new THREE.Raycaster();
// 一键清除全部飞行轨迹（不清除飞机与状态，仅清轨迹线）
document.getElementById('trail-clear').addEventListener('click', () => {
  for (const u of Object.values(uavs)) {
    u.trailPts = [];
    if (u.trailGeom) {
      u.trailGeom.setDrawRange(0, 0);
      u.trailGeom.attributes.position.needsUpdate = true;
    }
  }
  showToast('飞行轨迹已清除', true);
});
let gotoDown = null;
renderer.domElement.addEventListener('mousedown', (e) => { gotoDown = { x: e.clientX, y: e.clientY }; });
renderer.domElement.addEventListener('mouseup', (e) => {
  if (!gotoMode || !gotoDown) return;
  const moved = Math.hypot(e.clientX - gotoDown.x, e.clientY - gotoDown.y);
  gotoDown = null;
  if (moved > 5 || e.button !== 0) return;   // 拖拽旋转视角不算点击
  const u = selectedNs && uavs[selectedNs];
  if (!u || !u.pos || Date.now() - u.lastSeen > 3000) { showToast('请先点击卡片选择一架在线飞机', false); return; }
  if (!u.status || u.status.arming_state !== 2) { showToast(`${u.ns} 未起飞（指点飞行需先起飞）`, false); return; }
  // 目标高度 = 该机当前高度（等高水平指点），平面求交也用这个高度
  const h = Math.max(0.5, -u.pos.z);
  const rect = renderer.domElement.getBoundingClientRect();
  const ndc = new THREE.Vector2(((e.clientX - rect.left) / rect.width) * 2 - 1,
                                -((e.clientY - rect.top) / rect.height) * 2 + 1);
  raycaster.setFromCamera(ndc, camera);
  const { origin, direction } = raycaster.ray;
  if (Math.abs(direction.y) < 1e-6) return;
  const t = (h - origin.y) / direction.y;    // three.js 里 y 是高度
  if (t <= 0) return;
  const p = origin.clone().add(direction.clone().multiplyScalar(t));
  // ned2three(n,e,d)=(e,-d,-n) 的逆变换：共享 NED = (n=-p.z, e=p.x)
  const shared = { n: -p.z, e: p.x };
  if (Math.hypot(shared.n, shared.e) > FENCE_R) { showToast(`目标点在围栏外（R=${FENCE_R}m），已拒绝`, false); return; }
  // 共享 NED -> 该机本地系：偏移 = 当前共享坐标 - 当前本地坐标（GPS 模式各机原点不同）
  const ne = uavNe(u);
  const localN = shared.n - (ne.n - u.pos.x);   // 目标在该机本地系的北向分量
  const localE = shared.e - (ne.e - u.pos.y);   // 东向分量
  // Drone.goto 是 ENU：x=东, y=北（别按 NED 顺序传，会飞错方向）
  const id = sendCmd(u, 'goto', null, { x: +localE.toFixed(2), y: +localN.toFixed(2), z: +h.toFixed(2) });
  // 目标标记（金色圆锥，完成/失败/超时后自动移除）
  const marker = new THREE.Mesh(new THREE.ConeGeometry(0.25, 0.8, 12),
                                new THREE.MeshBasicMaterial({ color: 0xffb300, transparent: true, opacity: 0.9 }));
  marker.rotation.x = Math.PI;   // 尖端朝下指向目标点
  marker.position.set(p.x, h + 0.4, p.z);
  scene.add(marker);
  pendingCmds[id].marker = marker;
});

// 地面网格与坐标轴 (NED: three.x=东, three.y=上, three.z=-北)
scene.add(new THREE.GridHelper(20, 20, 0x30363d, 0x21262d));
// 原点坐标指示: ROS 风格的右手系 (ENU 语义: X=东, Y=北, Z=上)
// three 场景内 +X=东, +Y=上, -Z=北（数据映射行列式为+1，整体即右手系）
const axesOrigin = new THREE.Vector3(0, 0.01, 0);
function mkAxis(dir, color, text) {
  scene.add(new THREE.ArrowHelper(dir, axesOrigin, 2, color, 0.35, 0.18));
  const lb = makeLabel(text, '#' + color.toString(16).padStart(6, '0'));
  lb.position.copy(dir).multiplyScalar(2.5);
  lb.scale.set(1.0, 0.26, 1);
  scene.add(lb);
}
mkAxis(new THREE.Vector3(1, 0, 0), 0xff5252, 'X 东');
mkAxis(new THREE.Vector3(0, 0, -1), 0x4caf50, 'Y 北');
mkAxis(new THREE.Vector3(0, 1, 0), 0x42a5f5, 'Z 上');
const homeMark = new THREE.Mesh(
  new THREE.CylinderGeometry(0.4, 0.4, 0.02, 32),
  new THREE.MeshBasicMaterial({ color: 0x8b949e, transparent: true, opacity: 0.5 }));
scene.add(homeMark);
scene.add(new THREE.AmbientLight(0xffffff, 0.7));
const dl = new THREE.DirectionalLight(0xffffff, 1.2); dl.position.set(5, 10, 3); scene.add(dl);

// 地理围栏（全息风）：半透明圆柱墙 + 地面实线环 + 旋转虚线扫描环 + 顶环
const fenceMat = new THREE.MeshBasicMaterial({
  color: 0x00e5ff, transparent: true, opacity: 0.06,
  side: THREE.DoubleSide, blending: THREE.AdditiveBlending, depthWrite: false,
});
const fenceWall = new THREE.Mesh(new THREE.CylinderGeometry(FENCE_R, FENCE_R, FENCE_H, 96, 1, true), fenceMat);
fenceWall.position.y = FENCE_H / 2;
scene.add(fenceWall);
const fenceRingPts = [];
for (let i = 0; i <= 128; i++) {
  const a = (i / 128) * Math.PI * 2;
  fenceRingPts.push(new THREE.Vector3(Math.cos(a) * FENCE_R, 0, Math.sin(a) * FENCE_R));
}
const fenceRingGeo = new THREE.BufferGeometry().setFromPoints(fenceRingPts);
const fenceGround = new THREE.Line(fenceRingGeo, new THREE.LineBasicMaterial({ color: 0x00e5ff, transparent: true, opacity: 0.55 }));
fenceGround.position.y = 0.02;
scene.add(fenceGround);
const fenceScan = new THREE.Line(fenceRingGeo.clone(), new THREE.LineDashedMaterial({ color: 0x66ffff, dashSize: 0.8, gapSize: 0.5, transparent: true, opacity: 0.9 }));
fenceScan.computeLineDistances();
fenceScan.position.y = 0.06;
scene.add(fenceScan);
const fenceTop = new THREE.Line(fenceRingGeo.clone(), new THREE.LineBasicMaterial({ color: 0x00e5ff, transparent: true, opacity: 0.25 }));
fenceTop.position.y = FENCE_H;
scene.add(fenceTop);

function ned2three(x, y, z) { return new THREE.Vector3(y, -z, -x); }

// ---- 坐标系模式 ----
// local(本机/UWB): 各机本地坐标即全局坐标（UWB 世界系各机同原点），直接使用
// gps(GPS 共享):   GPS 场景各机 EKF 原点不同，用经纬度换算到共享平面（原点 = uav_1 的 EKF 原点）
let geoRef = null;
const EARTH_R = 6378137;
const coordModeSel = document.getElementById('coord-mode');
coordModeSel.value = localStorage.getItem('coordMode') || 'gps';
coordModeSel.addEventListener('change', () => {
  localStorage.setItem('coordMode', coordModeSel.value);
  for (const u of Object.values(uavs)) u.trailPts = [];  // 切换后清轨迹，避免跨坐标系连线
});

function sharedNed(u) {
  if (!u.gpos || !geoRef) return null;
  const dLat = (u.gpos.lat - geoRef.lat) * Math.PI / 180;
  const dLon = (u.gpos.lon - geoRef.lon) * Math.PI / 180;
  return {
    n: dLat * EARTH_R,
    e: dLon * EARTH_R * Math.cos(geoRef.lat * Math.PI / 180),
  };
}

// 当前模式下各机的水平 NED 坐标
function uavNe(u) {
  if (coordModeSel.value === 'gps') {
    const s = sharedNed(u);
    if (s) return s;
  }
  return { n: u.pos.x, e: u.pos.y };
}

function makeLabel(text, cssColor) {
  const c = document.createElement('canvas'); c.width = 256; c.height = 64;
  const g = c.getContext('2d');
  g.font = 'bold 40px sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillStyle = cssColor; g.fillText(text, 128, 32);
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(c), depthTest: false }));
  sp.scale.set(2.2, 0.55, 1);
  return sp;
}

function createMesh(u) {
  const group = new THREE.Group();      // 外层: 只负责位置
  const frame = new THREE.Group();      // 内层: 负责姿态 (local: x=机头, y=右翼, z=下)
  group.add(frame);
  const mat = new THREE.MeshStandardMaterial({ color: u.color });
  // X 型机臂（水平面内）
  const armGeom = new THREE.BoxGeometry(0.9, 0.05, 0.05);
  const arm1 = new THREE.Mesh(armGeom, mat); arm1.rotation.z = Math.PI / 4; frame.add(arm1);
  const arm2 = new THREE.Mesh(armGeom, mat); arm2.rotation.z = -Math.PI / 4; frame.add(arm2);
  // 中心机身
  frame.add(new THREE.Mesh(new THREE.BoxGeometry(0.22, 0.22, 0.08), mat));
  // 四个电机
  const motorGeom = new THREE.CylinderGeometry(0.06, 0.06, 0.08, 12);
  const propGeom = new THREE.BoxGeometry(0.34, 0.02, 0.008);
  const discGeom = new THREE.CircleGeometry(0.18, 24);
  u.props = [];
  u.discs = [];
  u.propDirs = [1, -1, -1, 1]; // 相邻桨对转
  [[1, 1], [1, -1], [-1, 1], [-1, -1]].forEach(([mx, my], mi) => {
    const motor = new THREE.Mesh(motorGeom, mat);
    motor.rotation.x = Math.PI / 2; // 转轴沿 local z
    motor.position.set(mx * 0.318, my * 0.318, 0);
    frame.add(motor);
    // 桨叶（绕 local z 旋转）
    const prop = new THREE.Mesh(propGeom, new THREE.MeshStandardMaterial({ color: 0xdddddd }));
    prop.position.set(mx * 0.318, my * 0.318, -0.06);
    frame.add(prop);
    u.props.push(prop);
    // 旋转时的半透明桨盘（转速越高越明显）
    const disc = new THREE.Mesh(discGeom, new THREE.MeshBasicMaterial({
      color: u.color, transparent: true, opacity: 0, side: THREE.DoubleSide, depthWrite: false,
    }));
    disc.position.set(mx * 0.318, my * 0.318, -0.06);
    frame.add(disc);
    u.discs.push(disc);
  });
  u.spin = 0; // 0=停转 1=全速
  // 机头方向指示（白色圆锥，锥尖朝 local +X）
  const nose = new THREE.Mesh(
    new THREE.ConeGeometry(0.08, 0.25, 12),
    new THREE.MeshStandardMaterial({ color: 0xffffff }));
  nose.rotation.z = -Math.PI / 2;
  nose.position.set(0.35, 0, 0);
  frame.add(nose);
  u.frame = frame;
  u.label = makeLabel(u.ns, u.css);     // 标签挂场景，不随姿态翻转
  scene.add(u.label);
  u.mesh = group;
  scene.add(group);

  u.trailGeom = new THREE.BufferGeometry();
  u.trailGeom.setAttribute('position', new THREE.BufferAttribute(new Float32Array(TRAIL_LEN * 3), 3));
  u.trail = new THREE.Line(u.trailGeom, new THREE.LineBasicMaterial({ color: u.color, transparent: true, opacity: 0.55 }));
  u.trail.frustumCulled = false;
  scene.add(u.trail);
}

// PX4 vehicle_attitude.q = [w,x,y,z]，表示机体(FRD) -> NED 的旋转。
// three 坐标系 = M * NED（M: three_x=东, three_y=上=-下, three_z=-北），
// 因此 three 下的旋转矩阵 R' = M * R，即 R' 的三行分别为 R 的第2行、-第3行、-第1行。
const _m4 = new THREE.Matrix4();

function update3D(u) {
  // XY 按所选坐标系（GPS 共享 / 本机UWB），高度始终用本地 -z（相对各机起点）
  const ne = uavNe(u);
  const p = ned2three(ne.n, ne.e, u.pos.z);
  u.mesh.position.copy(p);
  u.label.position.set(p.x, p.y + 0.7, p.z);
  u.outFence = Math.hypot(p.x, p.z) > FENCE_R || p.y > FENCE_H;
  // 越界自动执行用户选择的围栏动作（15 秒冷却；飞控侧 GF_* 是主保险）
  // 已在目标模式中时不重复下发：NAV_RTL/NAV_LAND 重复发送会让 navigator 重新开始，
  // 飞机在边界处被反复"重启"返航/降落流程而永远落不了地（实测踩过的坑）
  const FENCE_NAV_DONE = { hold: 4, rtl: 5, land: 18 };   // AUTO_LOITER/AUTO_RTL/AUTO_LAND
  const armedNow = u.status && u.status.arming_state === 2;
  const fenceAct = fenceActionSel.value;
  const alreadyDoing = u.status && u.status.nav_state === FENCE_NAV_DONE[fenceAct];
  if (u.outFence && armedNow && fenceAct !== 'off' && !alreadyDoing && (!u.lastFenceCmd || Date.now() - u.lastFenceCmd > 15000)) {
    u.lastFenceCmd = Date.now();
    sendFenceCmd(u, fenceAct);
    showFenceAlert(u.ns, fenceAct);
  }
  if (u.att && u.att.q) {
    const [w, x, y, z] = u.att.q;
    const r00 = 1 - 2 * (y * y + z * z), r01 = 2 * (x * y - z * w),     r02 = 2 * (x * z + y * w);
    const r10 = 2 * (x * y + z * w),     r11 = 1 - 2 * (x * x + z * z), r12 = 2 * (y * z - x * w);
    const r20 = 2 * (x * z - y * w),     r21 = 2 * (y * z + x * w),     r22 = 1 - 2 * (x * x + y * y);
    _m4.set(
       r10,  r11,  r12, 0,
      -r20, -r21, -r22, 0,
      -r00, -r01, -r02, 0,
       0, 0, 0, 1);
    u.frame.quaternion.setFromRotationMatrix(_m4);
  } else {
    u.frame.rotation.set(0, -u.pos.heading, 0); // 姿态数据未到时只用航向
  }
  const last = u.trailPts[u.trailPts.length - 1];
  if (!last || last.distanceTo(p) > 0.05) {
    u.trailPts.push(p.clone());
    if (u.trailPts.length > TRAIL_LEN) u.trailPts.shift();
    const arr = u.trailGeom.attributes.position.array;
    u.trailPts.forEach((pt, i) => { arr[i * 3] = pt.x; arr[i * 3 + 1] = pt.y; arr[i * 3 + 2] = pt.z; });
    u.trailGeom.setDrawRange(0, u.trailPts.length);
    u.trailGeom.attributes.position.needsUpdate = true;
  }
}

function animate() {
  requestAnimationFrame(animate);
  // 围栏动效：呼吸脉冲 + 虚线环旋转扫描；有飞机越界时整体变红快闪
  const t = performance.now() * 0.001;
  const breach = Object.values(uavs).some((u) => u.outFence);
  if (breach) {
    fenceMat.color.setHex(0xff3355);
    fenceMat.opacity = 0.10 + 0.08 * Math.abs(Math.sin(t * 8));
  } else {
    fenceMat.color.setHex(0x00e5ff);
    fenceMat.opacity = 0.05 + 0.03 * Math.sin(t * 2);
  }
  fenceScan.rotation.y = t * 0.4;
  fenceScan.material.color.setHex(breach ? 0xff5566 : 0x66ffff);
  // 桨叶：解锁加速旋转，上锁减速停下；桨盘透明度随转速
  for (const u of Object.values(uavs)) {
    if (!u.props) continue;
    const armed = u.status && u.status.arming_state === 2;
    u.spin = Math.max(0, Math.min(1, (u.spin || 0) + (armed ? 0.03 : -0.02)));
    u.props.forEach((p, i) => { p.rotation.z += u.spin * 0.9 * u.propDirs[i]; });
    for (const d of u.discs) d.material.opacity = u.spin * 0.22;
  }
  camera.position.set(
    camTarget.x + camDist * Math.sin(camPhi) * Math.sin(camTheta),
    camTarget.y + camDist * Math.cos(camPhi),
    camTarget.z + camDist * Math.sin(camPhi) * Math.cos(camTheta));
  camera.lookAt(camTarget);
  renderer.render(scene, camera);
}
resize();
animate();
</script>
</body>
</html>
